{% extends 'base.html' %}
{% block title %}Expert Login - KisanSathi{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header text-center py-3" style="background: linear-gradient(135deg, #1565c0, #1976d2); color: #fff;">
                    <h4 class="mb-0"><i class="fas fa-user-md"></i> Expert Login</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" required autofocus>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">New expert? <a href="{% url 'expert_signup' %}" style="color: #1565c0; font-weight: 600;">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
