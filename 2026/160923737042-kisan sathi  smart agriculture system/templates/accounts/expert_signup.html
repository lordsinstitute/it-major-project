{% extends 'base.html' %}
{% block title %}Expert Signup - KisanSathi{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header text-center py-3" style="background: linear-gradient(135deg, #1565c0, #1976d2); color: #fff;">
                    <h4 class="mb-0"><i class="fas fa-user-md"></i> Expert Registration</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6"><div class="form-group">
                                <label>First Name *</label>
                                <input type="text" name="first_name" class="form-control" required>
                            </div></div>
                            <div class="col-md-6"><div class="form-group">
                                <label>Last Name *</label>
                                <input type="text" name="last_name" class="form-control" required>
                            </div></div>
                            <div class="col-md-6"><div class="form-group">
                                <label>Username *</label>
                                <input type="text" name="username" class="form-control" required>
                            </div></div>
                            <div class="col-md-6"><div class="form-group">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control">
                            </div></div>
                            <div class="col-md-6"><div class="form-group">
                                <label>Password *</label>
                                <input type="password" name="password" class="form-control" required>
                            </div></div>
                            <div class="col-md-6"><div class="form-group">
                                <label>Confirm Password *</label>
                                <input type="password" name="confirm_password" class="form-control" required>
                            </div></div>
                            <div class="col-md-6"><div class="form-group">
                                <label>Phone *</label>
                                <input type="text" name="phone" class="form-control" required>
                            </div></div>
                            <div class="col-md-6"><div class="form-group">
                                <label>Specialization *</label>
                                <select name="specialization" class="form-control" required>
                                    {% for val, label in specializations %}
                                    <option value="{{ val }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div></div>
                            <div class="col-md-8"><div class="form-group">
                                <label>Qualification *</label>
                                <input type="text" name="qualification" class="form-control" placeholder="e.g. M.Sc. Agriculture" required>
                            </div></div>
                            <div class="col-md-4"><div class="form-group">
                                <label>Experience (Years)</label>
                                <input type="number" name="experience_years" class="form-control" min="0" value="0">
                            </div></div>
                            <div class="col-12"><div class="form-group">
                                <label>Organization/Institute</label>
                                <input type="text" name="organization" class="form-control" placeholder="e.g. ICAR, State Agriculture University">
                            </div></div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
                            <i class="fas fa-user-plus"></i> Register as Expert
                        </button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">Already registered? <a href="{% url 'expert_login' %}" style="color: #1565c0; font-weight: 600;">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
