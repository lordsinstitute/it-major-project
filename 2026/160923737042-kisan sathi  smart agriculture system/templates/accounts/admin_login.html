{% extends 'base.html' %}
{% block title %}Admin Login - KisanSathi{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header text-center py-3" style="background: linear-gradient(135deg, #b71c1c, #c62828); color: #fff;">
                    <h4 class="mb-0"><i class="fas fa-user-shield"></i> Admin Login</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted text-center"><small>Default: admin / admin</small></p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" value="admin" required autofocus>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-danger btn-block btn-lg mt-3">
                            <i class="fas fa-sign-in-alt"></i> Admin Login
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
