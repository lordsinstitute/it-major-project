{% extends 'expert/base_expert.html' %}
{% block title %}Upload Guide - KisanSathi{% endblock %}
{% block expert_content %}
<div class="page-header" style="background: linear-gradient(135deg, #1565c0, #1976d2);">
    <h2><i class="fas fa-upload"></i> Upload Guide Material</h2>
    <p>Share agricultural knowledge with farmers in multiple languages</p>
</div>
<div class="row justify-content-center">
    <div class="col-md-9">
        <div class="card">
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-8"><div class="form-group">
                            <label><strong>Guide Title *</strong></label>
                            <input type="text" name="title" class="form-control" required>
                        </div></div>
                        <div class="col-md-4"><div class="form-group">
                            <label><strong>Related Crop *</strong></label>
                            <input type="text" name="crop" class="form-control" placeholder="e.g. Wheat" required>
                        </div></div>
                    </div>
                    <div class="form-group">
                        <label><strong>Description *</strong></label>
                        <textarea name="description" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label><strong>Content in English</strong></label>
                        <textarea name="content_english" class="form-control" rows="4" placeholder="Detailed guide content in English"></textarea>
                    </div>
                    <div class="form-group">
                        <label><strong>Content in Telugu (తెలుగు)</strong></label>
                        <textarea name="content_telugu" class="form-control" rows="4" placeholder="తెలుగులో గైడ్ కంటెంట్"></textarea>
                    </div>
                    <div class="form-group">
                        <label><strong>Content in Hindi (हिंदी)</strong></label>
                        <textarea name="content_hindi" class="form-control" rows="4" placeholder="हिंदी में गाइड सामग्री"></textarea>
                    </div>
                    <div class="form-group">
                        <label><strong>Upload File (PDF/Image, optional)</strong></label>
                        <input type="file" name="file" class="form-control-file" accept=".pdf,.jpg,.jpeg,.png">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        <i class="fas fa-upload"></i> Upload Guide
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
