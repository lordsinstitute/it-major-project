{% extends 'farmer/base_farmer.html' %}
{% block title %}Post Query - KisanSathi{% endblock %}
{% block farmer_content %}
<div class="page-header">
    <h2><i class="fas fa-question-circle"></i> Post a Query to Experts</h2>
    <p>Ask agricultural experts and get professional answers</p>
</div>
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label><strong>Query Title *</strong></label>
                        <input type="text" name="title" class="form-control" placeholder="Brief title of your query" required>
                    </div>
                    <div class="form-group">
                        <label><strong>Related Crop</strong></label>
                        <input type="text" name="crop" class="form-control" placeholder="e.g. Wheat, Rice, Cotton">
                    </div>
                    <div class="form-group">
                        <label><strong>Detailed Description *</strong></label>
                        <textarea name="description" class="form-control" rows="6" placeholder="Describe your problem in detail..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-green btn-lg btn-block">
                        <i class="fas fa-paper-plane"></i> Submit Query to Experts
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
