{% load static %}
<html>
<head>
<title>Cyber Risk Assessment</title>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" />
<script language="javascript">
	function validate(formObj)
	{
	if(formObj.t1.value.length==0)
	{
	alert("Please Enter username");
	formObj.t1.focus();
	return false;
	}
	if(formObj.t2.value.length==0)
	{
	alert("Please Enter password");
	formObj.t2.focus();
	return false;
	}
	if(formObj.t3.value.length==0)
	{
	alert("Please Enter Contact No");
	formObj.t3.focus();
	return false;
	}
	if(isNaN(formObj.t3.value)){
		alert("Contact No must be numeric");
		formObj.t3.focus();
		return false;
	}
	if(formObj.t4.value.length==0)
	{
	alert("Please Enter Email ID");
	formObj.t4.focus();
	return false;
	}
	var filter = /^([a-zA-Z0-9_\.\-])+\@(gmail+\.)+(com)+$/;
	if (!filter.test(formObj.t4.value)) {
		window.alert('enter a valid email address');
		formObj.t4.focus();
		return false;
	}
	if(formObj.t5.value.length==0)
	{
	alert("Please enter address");
	formObj.t5.focus();
	return false;
	}
	return true;
	}
	</script>
	
</head>
<body>
<div id="wrapper">
	<div id="header">
		<div id="logo">
			<center><font size="4" color="yellow">AI-Driven Holistic Cyber Risk Assessment for Cloud Continuum Using Multi-Layer Trust and Risk Analysis</font></center>
		</div>
		<div id="slogan">
			
		</div>
	</div>
	<div id="menu">

	
		<ul><center>
      <li><a href="{% url 'index' %}">Home</a></li>
	   <li><a href="{% url 'Login' %}">Login Here</a></li>
      <li><a href="{% url 'Signup' %}">Signup Here</a></li>
  </ul>
        </div>
       <br/>
        <div class="hbg"><img src="{% static 'images/investor.jpg' %}" width="980" height="200" alt="" /></div>
      				<center>
<form name="f1" method="post" action={% url 'SignupAction' %} onsubmit="return validate(this);">
{% csrf_token %}<br/>
   <h2><b>Signup Page</b></h2>
   
	<font size="" color="red"><center>{{ data|safe }}</center></font>
						
						<table align="center" width="30%" >
			 <tr><td><font size='3' color=black>Username</b></td>
			 <td><input type="text" name="t1" style="font-family: Comic Sans MS" size="30"></td></tr>
         
		  <tr><td><font size='3' color=black>Password</b></td><td><input name="t2" type="password" style="font-family: Comic Sans MS" size="30"></td></tr>
	
	<tr><td><font size='3' color=black>Phone&nbsp;No</b></td><td><input name="t3" type="Text" style="font-family: Comic Sans MS" size="15"></td></td></tr>
		  
			<tr><td><font size='3' color=black>Email&nbsp;ID</b></td><td><input name="t4" type="Text" style="font-family: Comic Sans MS" size="40"></td></td></tr>

		  <tr><td><font size='3' color=black>Address</b></td><td><input name="t5" type="Text" style="font-family: Comic Sans MS" size="40"></td></td></tr>

			<tr><td></td><td><input type="submit" value="Submit"></td>
			</table>
			<br/><br/><br/><br/>
				</div>	
					
				</div>
				
					
	</body>
</html>
